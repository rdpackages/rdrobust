[build-system]
requires = [
    "setuptools>=82.0.1,<83.0.0; python_version < '3.10'",
    "setuptools>=83.0.0; python_version >= '3.10'",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
pythonpath = ["src"]
norecursedirs = [".pytest_cache", "pytest-cache-files-*"]
